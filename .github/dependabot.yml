version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Skip AGP 9.5.1 due to build failures, while allowing newer releases such as 9.5.2 or 9.6.0.
      - dependency-name: "com.android.*"
        versions: ["9.5.1"]
    groups:
      androidx-compose:
        patterns:
          - "androidx.compose*"
      androidx-core:
        patterns:
          - "androidx.core*"
          - "androidx.lifecycle*"
          - "androidx.activity*"
      testing:
        patterns:
          - "junit*"
          - "androidx.test*"
          - "androidx.test.espresso*"
          - "androidx.test.ext*"
      android-build-tools:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin*"
